sonar.projectKey=javintrivedi_campus-compass-main
sonar.organization=javintrivedi

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=campus-compass-main
sonar.projectVersion=1.0

# Only analyze the backend source directory
sonar.sources=backend
sonar.tests=backend/test

# Quality Gate configuration
sonar.qualitygate.wait=false

# Encoding of the source code.
sonar.sourceEncoding=UTF-8

# Coverage reporting
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Exclude non-production-code files from analysis
sonar.exclusions=**/node_modules/**, **/test/**

# Exclude frontend (client-side) files from COVERAGE requirements
# These files can't be tested by backend unit tests
sonar.coverage.exclusions=backend/public/**
