sonar.projectKey=javintrivedi_campus-compass-main
sonar.organization=javintrivedi

sonar.projectName=campus-compass-main
sonar.projectVersion=1.0

# sonar.sources MUST be a directory (not a file path)
sonar.sources=backend

# Exclude non-production code from analysis
sonar.exclusions=backend/node_modules/**,backend/test/**,backend/public/**

# Exclude frontend files from COVERAGE measurement
# (client-side JS cannot be covered by backend unit tests)
sonar.coverage.exclusions=backend/public/**

sonar.qualitygate.wait=false
sonar.sourceEncoding=UTF-8

# Coverage report path (relative to project root)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
