apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  provider.yml: |
    apiVersion: 1
    providers:
      - name: 'Campus Compass'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-json
data:
  campus-compass.json: |
    {
      "title": "Campus Compass — Live Metrics",
      "uid": "campus-compass-main",
      "timezone": "browser",
      "refresh": "15s",
      "schemaVersion": 38,
      "panels": [
        {
          "id": 1,
          "title": "Total HTTP Requests",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area", "textMode": "auto" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "green", "value": null }] }
            }
          },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum(http_requests_total)",
            "legendFormat": "Total"
          }]
        },
        {
          "id": 2,
          "title": "Requests Per Second",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area" },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "blue", "value": null }, { "color": "red", "value": 10 }] }
            }
          },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum(rate(http_requests_total[1m]))",
            "legendFormat": "req/s"
          }]
        },
        {
          "id": 3,
          "title": "Node.js Heap Memory Used (MB)",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area" },
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes",
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 100 }, { "color": "red", "value": 200 }] }
            }
          },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "nodejs_heap_size_used_bytes / 1024 / 1024",
            "legendFormat": "Heap Used"
          }]
        },
        {
          "id": 4,
          "title": "Active Handles (Open Connections)",
          "type": "stat",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "options": { "colorMode": "background", "graphMode": "area" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "steps": [{ "color": "green", "value": null }] }
            }
          },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "nodejs_active_handles_total",
            "legendFormat": "Handles"
          }]
        },
        {
          "id": 5,
          "title": "HTTP Traffic Over Time (by Route)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 16, "h": 8 },
          "options": { "tooltip": { "mode": "multi" } },
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 2, "fillOpacity": 10 },
              "unit": "short"
            }
          },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "rate(http_requests_total[1m])",
            "legendFormat": "{{method}} {{route}} ({{status_code}})"
          }]
        },
        {
          "id": 6,
          "title": "Requests by Route",
          "type": "piechart",
          "gridPos": { "x": 16, "y": 4, "w": 8, "h": 8 },
          "options": { "pieType": "donut", "displayLabels": ["name", "percent"] },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum by(route) (http_requests_total)",
            "legendFormat": "{{route}}"
          }]
        },
        {
          "id": 7,
          "title": "Node.js Memory Over Time",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 7 },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "lineWidth": 2, "fillOpacity": 15 }
            }
          },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "nodejs_heap_size_used_bytes",
              "legendFormat": "Heap Used"
            },
            {
              "datasource": "Prometheus",
              "expr": "nodejs_heap_size_total_bytes",
              "legendFormat": "Heap Total"
            },
            {
              "datasource": "Prometheus",
              "expr": "nodejs_external_memory_bytes",
              "legendFormat": "External"
            }
          ]
        },
        {
          "id": 8,
          "title": "HTTP Status Code Breakdown",
          "type": "bargauge",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 7 },
          "options": { "orientation": "horizontal", "displayMode": "gradient" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 50 },
                  { "color": "red", "value": 100 }
                ]
              }
            }
          },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum by(status_code) (http_requests_total)",
            "legendFormat": "HTTP {{status_code}}"
          }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "300Mi"
              cpu: "300m"
          volumeMounts:
            - name: datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasource
          configMap:
            name: grafana-datasource
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard-json
          configMap:
            name: grafana-dashboard-json
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
